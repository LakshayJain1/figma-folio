<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g opacity="0.08" stroke="#fff" stroke-width="1" clip-path="url(#circle)">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <!-- head -->
  <circle cx="200" cy="155" r="62" fill="#ede9fe" opacity="0.95"/>
  <!-- body -->
  <ellipse cx="200" cy="310" rx="90" ry="68" fill="#ede9fe" opacity="0.95"/>
  <!-- initials overlay -->
  <text x="200" y="175" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#6d28d9" letter-spacing="-2">LJ</text>
</svg>
