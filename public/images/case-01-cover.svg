<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg1)"/>
  <ellipse cx="600" cy="337" rx="320" ry="220" fill="url(#glow1)"/>

  <!-- Graph nodes & edges (knowledge graph visual) -->
  <!-- edges -->
  <g stroke="#818cf8" stroke-width="1.5" opacity="0.4">
    <line x1="600" y1="338" x2="420" y2="230"/>
    <line x1="600" y1="338" x2="760" y2="210"/>
    <line x1="600" y1="338" x2="790" y2="440"/>
    <line x1="600" y1="338" x2="440" y2="460"/>
    <line x1="600" y1="338" x2="600" y2="190"/>
    <line x1="420" y1="230" x2="310" y2="310"/>
    <line x1="760" y1="210" x2="880" y2="300"/>
    <line x1="790" y1="440" x2="860" y2="540"/>
    <line x1="440" y1="460" x2="320" y2="520"/>
    <line x1="600" y1="190" x2="500" y2="110"/>
    <line x1="600" y1="190" x2="700" y2="115"/>
  </g>
  <!-- outer nodes -->
