    <circle cx="760" cy="210" r="18" opacity="0.9"/>
    <circle cx="790" cy="440" r="20" opacity="0.9"/>
    <circle cx="440" cy="460" r="16" opacity="0.9"/>
    <circle cx="600" cy="190" r="20" opacity="0.9"/>
    <circle cx="310" cy="310" r="12" opacity="0.7"/>
    <circle cx="880" cy="300" r="14" opacity="0.7"/>
    <circle cx="860" cy="540" r="10" opacity="0.6"/>
    <circle cx="320" cy="520" r="11" opacity="0.6"/>
    <circle cx="500" cy="110" r="13" opacity="0.7"/>
    <circle cx="700" cy="115" r="13" opacity="0.7"/>
  </g>
  <!-- center node -->
  <circle cx="600" cy="338" r="42" fill="#4f46e5" opacity="0.95"/>
  <circle cx="600" cy="338" r="42" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  <!-- center icon: simple shield -->
  <path d="M600 320 l-14 6 v14 c0 8 6 14 14 17 c8-3 14-9 14-17 v-14 z" fill="#e0e7ff" opacity="0.9"/>

  <!-- Label -->
  <rect x="80" y="490" width="460" height="1" fill="#818cf8" opacity="0.3"/>
  <text x="80" y="535" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#e0e7ff" letter-spacing="-0.5">Canopy AI</text>
  <text x="80" y="568" font-family="system-ui, sans-serif" font-size="16" fill="#818cf8" letter-spacing="1">REGULATORY INTELLIGENCE SYSTEM</text>

  <!-- Tag chips -->
  <rect x="80" y="430" width="80" height="28" rx="14" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
  <text x="120" y="449" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">RAG</text>
  <rect x="172" y="430" width="82" height="28" rx="14" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
  <text x="213" y="449" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">Neo4j</text>
  <rect x="266" y="430" width="96" height="28" rx="14" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
  <text x="314" y="449" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">Pinecone</text>
</svg>
