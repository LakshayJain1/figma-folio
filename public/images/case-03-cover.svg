<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>

  <!-- Chat window mock -->
  <rect x="280" y="80" width="640" height="460" rx="16" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="280" y="80" width="640" height="44" rx="16" fill="#132035"/>
  <rect x="280" y="104" width="640" height="20" fill="#132035"/>
  <circle cx="310" cy="102" r="6" fill="#ef4444" opacity="0.7"/>
  <circle cx="330" cy="102" r="6" fill="#f59e0b" opacity="0.7"/>
  <circle cx="350" cy="102" r="6" fill="#22c55e" opacity="0.7"/>
  <text x="600" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">AI Chat Interface</text>

  <!-- User bubble -->
  <rect x="460" y="148" width="420" height="40" rx="20" fill="#1d4ed8" opacity="0.9"/>
  <text x="670" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#bfdbfe">What are the FCA guidelines for crypto?</text>

  <!-- AI response bubble (streaming dots then text) -->
  <rect x="300" y="210" width="380" height="72" rx="14" fill="#1e293b"/>
  <text x="320" y="234" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Based on current FCA regulations,</text>
  <text x="320" y="254" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">cryptoasset firms must register and</text>
  <text x="320" y="274" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">comply with AML/CTF requirements...</text>

  <!-- streaming cursor -->
  <rect x="574" y="262" width="2" height="14" rx="1" fill="#38bdf8" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Second user bubble -->
  <rect x="500" y="308" width="360" height="40" rx="20" fill="#1d4ed8" opacity="0.9"/>
  <text x="680" y="333" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#bfdbfe">Summarise the latest PS23/6 update</text>

  <!-- AI response 2 -->
  <rect x="300" y="368" width="420" height="56" rx="14" fill="#1e293b"/>
  <text x="320" y="392" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">PS23/6 introduces new consumer duty</text>
  <text x="320" y="412" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">standards effective July 2024...</text>

  <!-- Input bar -->
  <rect x="296" y="446" width="608" height="78" rx="12" fill="#0f172a"/>
  <rect x="308" y="462" width="490" height="40" rx="10" fill="#1e293b"/>
  <text x="330" y="487" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Ask about FCA regulations...</text>
  <rect x="812" y="462" width="80" height="40" rx="10" fill="#1d4ed8"/>
  <text x="852" y="487" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Send</text>

  <!-- Latency badge -->
  <rect x="860" y="150" width="130" height="36" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="925" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5eead4">~900ms latency</text>
  <text x="925" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2dd4bf">↓ from 4s</text>

  <!-- Labels -->
  <rect x="80" y="570" width="460" height="1" fill="#38bdf8" opacity="0.2"/>
  <text x="80" y="612" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#e0f2fe" letter-spacing="-0.5">AI Chat Platform</text>
  <text x="80" y="645" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8" letter-spacing="1">STREAMING · INTENT CLASSIFICATION</text>
</svg>
