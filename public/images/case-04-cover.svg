<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg4)"/>

  <!-- Dashboard shell -->
  <rect x="80" y="60" width="1040" height="520" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- sidebar -->
  <rect x="80" y="60" width="200" height="520" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="80" y="60" width="200" height="520" rx="0" fill="#f8fafc"/>
  <rect x="80" y="60" width="12" height="520" rx="6" fill="#f8fafc"/>

  <!-- sidebar nav items -->
  <rect x="100" y="100" width="160" height="36" rx="8" fill="#eff6ff"/>
  <text x="125" y="123" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2563eb">Dashboard</text>
  <text x="125" y="162" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Products</text>
  <text x="125" y="196" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Stock Alerts</text>
  <text x="125" y="230" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Orders</text>
  <text x="125" y="264" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Analytics</text>
  <text x="125" y="298" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Settings</text>

  <!-- role badge -->
  <rect x="100" y="520" width="160" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="180" y="545" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">Admin · RBAC</text>

  <!-- main content -->
  <!-- stat cards -->
  <rect x="300" y="88" width="180" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="390" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">1,284</text>
  <text x="390" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Total SKUs</text>

  <rect x="500" y="88" width="180" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="590" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#15803d">98.2%</text>
  <text x="590" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Stock Health</text>

  <rect x="700" y="88" width="180" height="80" rx="10" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <text x="790" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#a16207">12</text>
  <text x="790" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Low Stock</text>

  <rect x="900" y="88" width="200" height="80" rx="10" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="1000" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#7e22ce">₹4.2L</text>
  <text x="1000" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Stock Value</text>

  <!-- Table -->
  <rect x="300" y="192" width="800" height="36" rx="0" fill="#f8fafc"/>
  <text x="320" y="215" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Product Name</text>
  <text x="560" y="215" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">SKU</text>
  <text x="680" y="215" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Qty</text>
  <text x="780" y="215" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Status</text>
  <text x="940" y="215" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Updated</text>
  <line x1="300" y1="228" x2="1100" y2="228" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Table rows -->
  <g font-family="system-ui,sans-serif" font-size="13" fill="#374151">
    <text x="320" y="256">Office Chair Pro 500</text>
    <text x="560" y="256">OC-PRO-500</text>
    <text x="680" y="256">234</text>
    <rect x="775" y="242" width="62" height="22" rx="11" fill="#dcfce7"/>
    <text x="806" y="257" text-anchor="middle" font-size="11" fill="#15803d">In Stock</text>
    <text x="940" y="256">2h ago</text>
    <line x1="300" y1="268" x2="1100" y2="268" stroke="#f1f5f9" stroke-width="1"/>

    <text x="320" y="295">Standing Desk Elite</text>
    <text x="560" y="295">SD-ELT-01</text>
    <text x="680" y="295">8</text>
    <rect x="775" y="281" width="72" height="22" rx="11" fill="#fef9c3"/>
    <text x="811" y="296" text-anchor="middle" font-size="11" fill="#a16207">Low Stock</text>
    <text x="940" y="295">5m ago</text>
    <line x1="300" y1="307" x2="1100" y2="307" stroke="#f1f5f9" stroke-width="1"/>

    <text x="320" y="334">Ergonomic Keyboard</text>
    <text x="560" y="334">KB-ERG-77</text>
    <text x="680" y="334">512</text>
    <rect x="775" y="320" width="62" height="22" rx="11" fill="#dcfce7"/>
    <text x="806" y="335" text-anchor="middle" font-size="11" fill="#15803d">In Stock</text>
    <text x="940" y="334">1d ago</text>
    <line x1="300" y1="346" x2="1100" y2="346" stroke="#f1f5f9" stroke-width="1"/>

    <text x="320" y="373">Monitor 4K 32"</text>
    <text x="560" y="373">MON-4K-32</text>
    <text x="680" y="373">0</text>
    <rect x="775" y="359" width="72" height="22" rx="11" fill="#fee2e2"/>
    <text x="811" y="374" text-anchor="middle" font-size="11" fill="#dc2626">Out of Stock</text>
    <text x="940" y="373">3d ago</text>
  </g>

  <!-- Mini chart -->
  <rect x="300" y="395" width="800" height="168" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="418" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#374151">Stock Movement — Last 7 Days</text>
  <polyline points="340,540 440,510 540,525 640,490 740,500 840,470 940,480 1040,455 1080,462" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="340,540 440,510 540,525 640,490 740,500 840,470 940,480 1040,455 1080,462 1080,555 340,555" fill="#2563eb" fill-opacity="0.08"/>
</svg>
