<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>

  <!-- Large typographic display -->
  <text x="80" y="210" font-family="Georgia, serif" font-size="130" font-weight="700" fill="#f5f5f5" letter-spacing="-5" opacity="0.95">Brand</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="130" font-weight="700" fill="none" stroke="#f5f5f5" stroke-width="2" letter-spacing="-5" opacity="0.4">System</text>

  <!-- Color palette swatches -->
  <rect x="80" y="380" width="80" height="80" rx="8" fill="#ef4444"/>
  <rect x="172" y="380" width="80" height="80" rx="8" fill="#f97316"/>
  <rect x="264" y="380" width="80" height="80" rx="8" fill="#facc15"/>
  <rect x="356" y="380" width="80" height="80" rx="8" fill="#4ade80"/>
  <rect x="448" y="380" width="80" height="80" rx="8" fill="#38bdf8"/>
  <rect x="540" y="380" width="80" height="80" rx="8" fill="#818cf8"/>
  <rect x="632" y="380" width="80" height="80" rx="8" fill="#e879f9"/>
  <rect x="724" y="380" width="80" height="80" rx="8" fill="#f1f5f9"/>

  <!-- Hex label under first few -->
  <text x="120" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">#ef4444</text>
  <text x="212" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">#f97316</text>
  <text x="304" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">#facc15</text>

  <!-- Logo grid -->
  <rect x="860" y="80" width="260" height="520" rx="12" fill="#1f1f1f" stroke="#2a2a2a" stroke-width="1"/>
  <text x="990" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280" letter-spacing="2">LOGO VARIANTS</text>
  <line x1="880" y1="124" x2="1100" y2="124" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Logo 1 — wordmark -->
  <rect x="890" y="140" width="220" height="100" rx="8" fill="#141414"/>
  <text x="1000" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#f5f5f5" letter-spacing="-1">Client Co</text>
  <text x="1000" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" letter-spacing="3">WORDMARK</text>

  <!-- Logo 2 — icon mark -->
  <rect x="890" y="260" width="220" height="100" rx="8" fill="#141414"/>
  <circle cx="980" cy="310" r="28" fill="none" stroke="#f5f5f5" stroke-width="3"/>
  <text x="980" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#f5f5f5">C</text>
  <text x="1030" y="310" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" letter-spacing="3">ICON MARK</text>

  <!-- Logo 3 — reversed -->
  <rect x="890" y="380" width="220" height="100" rx="8" fill="#f5f5f5"/>
  <text x="1000" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#141414" letter-spacing="-1">Client Co</text>
  <text x="1000" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9ca3af" letter-spacing="3">REVERSED</text>

  <!-- Type specimen -->
  <text x="890" y="510" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" letter-spacing="2">TYPE SPECIMEN</text>
  <text x="890" y="535" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#f5f5f5">Aa Bb Cc</text>
  <text x="890" y="558" font-family="system-ui,sans-serif" font-size="14" fill="#9ca3af">ABCDEFGHIJKLMNOP</text>

  <!-- Labels bottom -->
  <rect x="80" y="510" width="460" height="1" fill="#6b7280" opacity="0.3"/>
  <text x="80" y="555" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#f5f5f5" letter-spacing="-0.5">Brand + Web Design</text>
  <text x="80" y="588" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280" letter-spacing="1">UI/UX · IDENTITY · FRAMER · SPLINE 3D</text>
</svg>
